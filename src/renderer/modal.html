<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="app-name"></title>
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <header class="titlebar">
        <img src="./assets/icon.png">
        <p class="app-name"></p>
    </header>

    <main class="modal center-column">
        <div></div>
        <button id="modal-button">
            Okay
        </button>
    </main>
    <script type="module" src="./src/modal.ts"></script>
</body>

<template id="nudge-template">
    <h1 class="modal__title" id="modal__nudge__title"></h1>
    <p class="modal__body" id="modal__nudge__body"></p>
    <div class="modal-bottom">
        <p id="modal__nudge__reminder_count-container">
            This is your <span id="modal__nudge__reminder_count" class="bold-primary"></span>
            Nudge<span id="modal__nudge__ignored_reminder_count-container">,
                and your
                <span id="modal__nudge__ignored_reminder_count" class="bold-primary"></span>
                ignored Nudge. You have ignored
                <span id="modal__nudge__ignored_reminder_minutes" class="bold-primary"></span>
                minutes of nudges</span>.
        </p>

    </div>
</template>

<template id="simple-template">
    <h1 class="modal__title" id="modal__simple__title"></h1>
    <p class="modal__body" id="modal__simple__body"></p>
</template>

</html>
